<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>파스텔 빼빼로 뽑기</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #FFF9F2;
            background-image: radial-gradient(#FDE2E4 2px, transparent 2px);
            background-size: 24px 24px;
        }

        .font-cute {
            font-family: 'Gaegu', cursive;
        }

        .pastel-card {
            background: rgba(255, 255, 255, 0.95);
            border: 4px solid #FFCAD4;
            box-shadow: 0 10px 25px -5px rgba(255, 182, 193, 0.4), 0 8px 10px -6px rgba(255, 182, 193, 0.2);
            border-radius: 2rem;
        }

        .pastel-btn {
            background: linear-gradient(135deg, #FFB5A7 0%, #FCD5CE 100%);
            box-shadow: 0 6px 0px #F8AD9D;
            transition: all 0.1s ease;
        }

        .pastel-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 0px #F8AD9D;
        }

        .pastel-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0px #F8AD9D;
        }

        .pastel-btn:disabled {
            background: #E0E0E0;
            box-shadow: 0 4px 0px #BDBDBD;
            cursor: not-allowed;
            transform: none;
        }

        /* Bounce Animation for Gift Icon */
        .icon-bounce {
            animation: giftJump 0.35s infinite alternate ease-in-out;
        }

        @keyframes giftJump {
            from { transform: translateY(0) scale(1); }
            to { transform: translateY(-12px) scale(1.05, 0.95); }
        }

        .pepero-glow {
            text-shadow: 0 0 15px rgba(255, 181, 167, 0.6);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 md:p-8 text-gray-700 select-none">

    <!-- Header Section -->
    <header class="text-center mt-2 mb-3">
        <h1 class="font-cute text-4xl sm:text-6xl font-bold text-pink-400 drop-shadow-sm flex items-center justify-center gap-2">
            <span>🎁</span> 랜덤 빼빼로 뽑기 <span>🍫</span>
        </h1>
        <p class="text-gray-500 text-sm sm:text-base font-medium mt-1">
            꽝은 없다! 25명 학생 중 <span class="text-pink-500 font-bold underline">5명은 행운의 2개(더블) 당첨!</span> ✨
        </p>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-2xl flex flex-col items-center gap-6">

        <!-- Info Bar (Remaining Count & Progress) -->
        <div class="pastel-card w-full p-4 flex items-center justify-between gap-4">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-graduation-cap text-pink-400 text-xl"></i>
                <span class="font-bold text-gray-700 text-base sm:text-lg">뽑을 학생:</span>
                <span id="student-count-display" class="font-bold text-pink-500 text-xl">1 / 25번째</span>
            </div>
            <div class="flex items-center gap-2 bg-pink-50 px-4 py-1.5 rounded-full border border-pink-200">
                <i class="fa-solid fa-cookie-bite text-amber-500 text-lg"></i>
                <span class="font-bold text-sm sm:text-base text-gray-700">남은 빼빼로:</span>
                <span id="remaining-total-display" class="font-black text-pink-500 text-lg">30 / 30개</span>
            </div>
        </div>

        <!-- Center Stage: Top Gift Animation + Display Box -->
        <div class="pastel-card w-full p-6 sm:p-8 flex flex-col items-center relative overflow-hidden">
            
            <!-- Gift Box Icon Header -->
            <div id="gift-character" class="relative w-24 h-24 sm:w-28 sm:h-28 mb-2 transition-transform duration-300 flex items-center justify-center bg-pink-100 rounded-full border-4 border-pink-200 shadow-inner">
                <span class="text-5xl sm:text-6xl">🎁</span>
            </div>

            <!-- Pepero Result Display Box -->
            <div id="display-box" class="w-full bg-gradient-to-b from-orange-50 to-pink-50 border-4 border-dashed border-pink-200 rounded-2xl py-6 my-2 text-center relative shadow-inner min-h-[160px] flex flex-col items-center justify-center">
                <div id="display-icon" class="text-5xl sm:text-6xl mb-2">🍫</div>
                <div id="display-title" class="font-cute text-4xl sm:text-6xl font-bold text-pink-500 tracking-wider pepero-glow">
                    빼빼로 뽑기!
                </div>
                <p id="status-text" class="text-xs sm:text-sm text-pink-400 font-bold mt-2">
                    아래 버튼을 눌러 빼빼로를 뽑아주세요!
                </p>
            </div>

            <!-- Draw Button -->
            <button id="draw-btn" class="pastel-btn w-full py-4 sm:py-5 mt-4 rounded-2xl text-white font-black text-2xl sm:text-3xl tracking-widest flex items-center justify-center gap-3">
                <i class="fa-solid fa-gift"></i>
                <span>빼빼로 뽑기!</span>
            </button>
        </div>

        <!-- Inventory / Stock Status Board -->
        <div class="pastel-card w-full p-4 sm:p-6">
            <h3 class="font-bold text-base sm:text-lg text-gray-700 mb-3 border-b-2 border-pink-100 pb-2 flex items-center gap-2">
                <i class="fa-solid fa-boxes-stacked text-pink-400"></i>
                종류별 잔여 현황 (각 5개씩 총 30개)
            </h3>
            <div id="inventory-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                <!-- Dynamically populated inventory items -->
            </div>
        </div>

        <!-- History Record Card -->
        <div class="pastel-card w-full p-4 sm:p-6">
            <div class="flex items-center justify-between mb-3 border-b-2 border-pink-100 pb-2">
                <h3 class="font-bold text-base sm:text-lg text-gray-700 flex items-center gap-2">
                    <i class="fa-solid fa-clock-rotate-left text-pink-400"></i>
                    뽑힌 순서 기록 (<span id="history-count">0</span>/25명)
                </h3>
                <button id="reset-btn" class="text-xs sm:text-sm text-gray-400 hover:text-pink-500 font-bold underline transition-colors flex items-center gap-1">
                    <i class="fa-solid fa-rotate-right"></i> 초기화
                </button>
            </div>

            <div id="history-list" class="flex flex-wrap gap-2 sm:gap-3 min-h-[50px] max-h-48 overflow-y-auto p-1 items-center">
                <span id="empty-history-msg" class="text-gray-400 text-sm font-medium italic w-full text-center py-2">
                    아직 뽑힌 빼빼로가 없어요 🍫
                </span>
            </div>
        </div>
    </main>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-6 bg-gray-800 text-white px-6 py-3 rounded-full text-sm font-bold opacity-0 transition-opacity duration-300 pointer-events-none shadow-lg z-50">
        알림 메시지
    </div>

    <footer class="mt-8 text-center text-xs text-pink-300 font-medium">
        🌸 즐거운 우리 반! 100% 당첨 빼빼로 뽑기 🌸
    </footer>

    <!-- Logic Script -->
    <script>
        // Data Types & Stock Configuration
        const INITIAL_PEPERO_TYPES = [
            { id: 'choco', name: '초코 (기본)', icon: '🍫', color: 'bg-amber-100 text-amber-900 border-amber-300', initialCount: 5 },
            { id: 'nude', name: '누드', icon: '🥖', color: 'bg-yellow-100 text-yellow-900 border-yellow-300', initialCount: 5 },
            { id: 'strawberry', name: '딸기', icon: '🍓', color: 'bg-pink-100 text-pink-900 border-pink-300', initialCount: 5 },
            { id: 'crunky', name: '크런키', icon: '🍪', color: 'bg-stone-100 text-stone-900 border-stone-300', initialCount: 5 },
            { id: 'almond', name: '아몬드', icon: '🥜', color: 'bg-orange-100 text-orange-900 border-orange-300', initialCount: 5 },
            { id: 'whitecookie', name: '화이트 쿠키', icon: '🍨', color: 'bg-slate-100 text-slate-800 border-slate-300', initialCount: 5 }
        ];

        const TOTAL_STUDENTS = 25;
        const DOUBLE_WINNER_COUNT = 5; // 5명의 학생은 2개 받음

        // Application State
        let stock = {};
        let pool = [];
        let history = [];
        let isSpinning = false;
        let drawCountsPerStudent = []; // 각 학생(1~25번째)이 받을 개수 지정 배열

        // DOM Elements
        const drawBtn = document.getElementById('draw-btn');
        const resetBtn = document.getElementById('reset-btn');
        const displayIcon = document.getElementById('display-icon');
        const displayTitle = document.getElementById('display-title');
        const statusText = document.getElementById('status-text');
        const studentCountDisplay = document.getElementById('student-count-display');
        const remainingTotalDisplay = document.getElementById('remaining-total-display');
        const inventoryGrid = document.getElementById('inventory-grid');
        const historyList = document.getElementById('history-list');
        const historyCount = document.getElementById('history-count');
        const giftChar = document.getElementById('gift-character');
        const toast = document.getElementById('toast');

        // Initialize state
        function initApp() {
            stock = {};
            pool = [];
            history = [];

            // 1. Fill 30 peperos pool
            INITIAL_PEPERO_TYPES.forEach(item => {
                stock[item.id] = item.initialCount;
                for (let i = 0; i < item.initialCount; i++) {
                    pool.push(item);
                }
            });

            // 2. Shuffle pool
            shuffleArray(pool);

            // 3. Create student draw quota array (20명: 1개, 5명: 2개 = 총 30개)
            drawCountsPerStudent = new Array(TOTAL_STUDENTS).fill(1);
            
            // Randomly select 5 distinct student indices for double chance
            const doubleIndices = [];
            while (doubleIndices.length < DOUBLE_WINNER_COUNT) {
                const randIdx = Math.floor(Math.random() * TOTAL_STUDENTS);
                if (!doubleIndices.includes(randIdx)) {
                    doubleIndices.push(randIdx);
                    drawCountsPerStudent[randIdx] = 2; // 2개 할당
                }
            }

            renderInventory();
            renderHistory();
            updateHeaderStats();

            displayIcon.textContent = '🎁';
            displayTitle.textContent = '빼빼로 뽑기!';
            statusText.textContent = '아래 버튼을 눌러 빼빼로를 뽑아주세요!';
            drawBtn.disabled = false;
        }

        // Shuffle Helper
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // Show Toast Notification
        function showToast(message) {
            toast.textContent = message;
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 2500);
        }

        // Update Stock Counts Header
        function updateHeaderStats() {
            const currentStudentNum = history.length + 1;
            if (history.length >= TOTAL_STUDENTS) {
                studentCountDisplay.textContent = `25 / 25명 완료! 🎉`;
            } else {
                studentCountDisplay.textContent = `${currentStudentNum} / 25번째`;
            }
            remainingTotalDisplay.textContent = `${pool.length} / 30개`;
        }

        // Render Inventory Grid
        function renderInventory() {
            inventoryGrid.innerHTML = '';
            INITIAL_PEPERO_TYPES.forEach(item => {
                const remaining = stock[item.id];
                const picked = item.initialCount - remaining;

                const card = document.createElement('div');
                card.className = `p-2.5 rounded-xl border flex flex-col justify-between ${item.color} transition-all`;
                
                card.innerHTML = `
                    <div class="flex items-center justify-between font-bold text-sm sm:text-base">
                        <span>${item.icon} ${item.name}</span>
                        <span class="text-xs px-2 py-0.5 rounded-full bg-white/70 shadow-sm">
                            ${remaining}/${item.initialCount}개
                        </span>
                    </div>
                    <div class="w-full bg-black/10 rounded-full h-2 mt-2 overflow-hidden">
                        <div class="bg-current h-2 rounded-full transition-all duration-300" style="width: ${(remaining / item.initialCount) * 100}%"></div>
                    </div>
                    <div class="text-[11px] opacity-75 font-semibold text-right mt-1">
                        뽑힌 개수: ${picked}개
                    </div>
                `;
                inventoryGrid.appendChild(card);
            });
        }

        // Render History List
        function renderHistory() {
            historyCount.textContent = history.length;
            historyList.innerHTML = '';

            if (history.length === 0) {
                const emptyMsg = document.createElement('span');
                emptyMsg.id = 'empty-history-msg';
                emptyMsg.className = 'text-gray-400 text-sm font-medium italic w-full text-center py-2';
                emptyMsg.textContent = '아직 뽑힌 빼빼로가 없어요 🍫';
                historyList.appendChild(emptyMsg);
                return;
            }

            // Render badges in reverse order (newest first)
            [...history].reverse().forEach((record) => {
                const badge = document.createElement('div');
                const isDouble = record.items.length > 1;

                if (isDouble) {
                    badge.className = `flex items-center gap-1.5 px-3 py-1.5 rounded-full border text-xs sm:text-sm font-bold bg-gradient-to-r from-pink-200 to-amber-200 text-pink-900 border-pink-300 shadow-sm`;
                    badge.innerHTML = `
                        <span class="bg-pink-500 text-white text-[10px] px-1.5 py-0.5 rounded-full">#${record.studentNum} 더블!</span>
                        <span>${record.items[0].icon}${record.items[1].icon} ${record.items[0].name} + ${record.items[1].name}</span>
                    `;
                } else {
                    const item = record.items[0];
                    badge.className = `flex items-center gap-1.5 px-3 py-1.5 rounded-full border text-xs sm:text-sm font-bold ${item.color} shadow-sm`;
                    badge.innerHTML = `
                        <span class="opacity-60 text-xs">#${record.studentNum}</span>
                        <span>${item.icon} ${item.name}</span>
                    `;
                }

                historyList.appendChild(badge);
            });
        }

        // Confetti Visual Effect
        function fireConfetti(isDouble = false) {
            const count = isDouble ? 280 : 180;
            const defaults = { origin: { y: 0.7 } };

            function fire(particleRatio, opts) {
                confetti(Object.assign({}, defaults, opts, {
                    particleCount: Math.floor(count * particleRatio)
                }));
            }

            fire(0.25, { spread: 26, startVelocity: 55, colors: ['#FFB5A7', '#FCD5CE', '#F8AD9D'] });
            fire(0.2, { spread: 60, colors: ['#FFFFFF', '#FFCAD4', '#FEE140'] });
            fire(0.35, { spread: 100, decay: 0.91, scalar: isDouble ? 1.2 : 0.8 });
            fire(0.1, { spread: 120, startVelocity: 25, colors: ['#FFE5EC', '#FFB5A7'] });
        }

        // Draw Action
        function drawPepero() {
            if (isSpinning) return;

            if (history.length >= TOTAL_STUDENTS) {
                showToast("25명의 모든 학생이 이미 뽑기를 완료했습니다! 🎉");
                return;
            }

            if (pool.length === 0) {
                showToast("빼빼로가 모두 소진되었습니다.");
                return;
            }

            const studentIndex = history.length;
            const getCount = drawCountsPerStudent[studentIndex]; // 1개 or 2개

            isSpinning = true;
            drawBtn.disabled = true;
            statusText.textContent = getCount === 2 ? "🎉 대박 예감! 두구두구... 과연?!" : "두구두구... 어떤 빼빼로가 나올까요?";
            statusText.classList.add('animate-pulse');
            giftChar.classList.add('icon-bounce');

            let counter = 0;
            const totalDuration = 1800;
            const speed = 60;

            const interval = setInterval(() => {
                const randomItem = INITIAL_PEPERO_TYPES[Math.floor(Math.random() * INITIAL_PEPERO_TYPES.length)];
                displayIcon.textContent = getCount === 2 ? `🎁 ${randomItem.icon}` : randomItem.icon;
                displayTitle.textContent = randomItem.name;
                counter += speed;

                if (counter >= totalDuration) {
                    clearInterval(interval);
                    finalizeDraw(getCount);
                }
            }, speed);
        }

        // Finalize Picked Item(s)
        function finalizeDraw(getCount) {
            const pickedItems = [];

            // Pop items according to assigned count for this student
            for (let i = 0; i < getCount; i++) {
                if (pool.length > 0) {
                    const item = pool.pop();
                    stock[item.id]--;
                    pickedItems.push(item);
                }
            }

            const currentStudentNum = history.length + 1;
            history.push({
                studentNum: currentStudentNum,
                items: pickedItems
            });

            // Display Final Result
            if (pickedItems.length === 2) {
                displayIcon.textContent = `${pickedItems[0].icon} + ${pickedItems[1].icon}`;
                displayTitle.textContent = `${pickedItems[0].name} & ${pickedItems[1].name}`;
                statusText.textContent = `💖 축하합니다! 럭키 더블 당첨! 빼빼로 2개 획득! 💖`;
            } else {
                displayIcon.textContent = pickedItems[0].icon;
                displayTitle.textContent = pickedItems[0].name;
                statusText.textContent = `🎉 축하합니다! [${pickedItems[0].name}] 당첨! 🎉`;
            }
            
            statusText.classList.remove('animate-pulse');
            giftChar.classList.remove('icon-bounce');
            fireConfetti(pickedItems.length === 2);

            // Update UI
            renderInventory();
            renderHistory();
            updateHeaderStats();

            isSpinning = false;
            
            if (history.length >= TOTAL_STUDENTS) {
                drawBtn.disabled = true;
                statusText.textContent = "✨ 25명 뽑기 완료! 30개 빼빼로가 완판되었습니다! ✨";
                showToast("모든 학생(25명)이 30개의 빼빼로를 모두 나눠 가졌습니다!");
            } else {
                drawBtn.disabled = false;
            }
        }

        // Event Listeners
        drawBtn.addEventListener('click', drawPepero);

        resetBtn.addEventListener('click', () => {
            if (history.length === 0) {
                showToast("초기화할 기록이 없습니다.");
                return;
            }
            initApp();
            showToast("뽑기 현황이 전체 초기화되었습니다!");
        });

        // Keyboard Shortcut (Spacebar)
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
                e.preventDefault();
                drawPepero();
            }
        });

        // Initialize App on Load
        window.onload = initApp;
    </script>
</body>
</html>
